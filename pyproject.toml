[project]
name = "eachday"
version = "0.1.0"
description = "Automatically align your gym progress photos and generate smooth timelapse videos."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pillow>=10.4.0",
    "pillow-heif>=0.18.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0,<2.3.0",
    "imageio-ffmpeg>=0.5.1",
    "ultralytics>=8.3.0",
]

[project.scripts]
eachday = "eachday.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eachday"]
